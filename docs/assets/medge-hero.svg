<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">MEDGE VISION: Evidence at the edge</title>
<desc id="desc">Three separate local inference paths. Decorative optical animation, not live telemetry.</desc>
<defs><linearGradient id="bg"><stop stop-color="#071923"/><stop offset="1" stop-color="#21162f"/></linearGradient></defs>
<style>.lens{transform-origin:1100px 135px;animation:orbit 28s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.lens{animation:none}}</style>
<rect width="1280" height="400" rx="24" fill="url(#bg)"/>
<circle cx="1100" cy="135" r="90" fill="none" stroke="#244650"/>
<circle class="lens" cx="1100" cy="135" r="76" fill="none" stroke="#64e5d2" stroke-width="2" stroke-dasharray="80 39"/>
<g transform="rotate(-35 1100 135)"><rect x="1070" y="85" width="60" height="100" rx="30" fill="#12323c" stroke="#64e5d2" stroke-width="2"/><path d="M1070 135h60" stroke="#64e5d2" stroke-width="2"/></g>
<g font-family="Segoe UI,Arial,sans-serif">
