name: CPU regression tests
on:
  push:
    paths-ignore:
      - 'model_parts/**'
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python tools/verify_repository_artifacts.py
      - run: python -m pytest tests -q
