name: CPU regression tests
on:
  push:
    paths-ignore:
      - 'model_parts/**'
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python tools/verify_repository_artifacts.py
      - name: Verify published metric tables against original evidence
        run: python tools/build_results_docs.py --check
      - name: Recompute retained anomaly metrics and audit split identities
        run: python tools/audit_retained_data.py
      - run: python -m pytest tests -q
      - name: Restore published demo backup and verify evidence
        run: python tools/restore_demo_backup.py --output /tmp/medge-demo-restore > demo_restore_verification.json
      - name: Execute all four CPU models on five selected cases
        run: python tools/smoke_models.py --output smoke_results.json
      - name: Native JSON generation-boundary regression
        run: g++ -std=c++17 tests/json_boundary_test.cpp -o /tmp/medge-json-boundary && /tmp/medge-json-boundary
      - uses: actions/upload-artifact@v4
        with:
          name: reproduction-verification
          path: |
            smoke_results.json
            demo_restore_verification.json
